name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git kmod libelf-dev \
            libssl-dev libncurses5-dev libncursesw5-dev python3 rsync \
            unzip xz-utils zip

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Resolve defconfig
        id: defconfig
        shell: bash
        run: |
          set -euo pipefail

          # 1) Tenta o que você estava usando
          CANDIDATES=(
            "vendor/mojito_defconfig"
            "mojito_defconfig"
            "vendor/xiaomi/mojito_defconfig"
          )

          FOUND=""
          for c in "${CANDIDATES[@]}"; do
            if [ -f "arch/arm64/configs/${c}" ]; then
              FOUND="$c"
              break
            fi
          done

          # 2) Fallback: procura qualquer *mojito*_defconfig
          if [ -z "$FOUND" ]; then
            MATCH="$(find arch/arm64/configs -type f -name '*mojito*_defconfig' | head -n1 || true)"
            if [ -n "$MATCH" ]; then
              FOUND="${MATCH#arch/arm64/configs/}"
            fi
          fi

          # 3) Último fallback: primeiro *_defconfig
          if [ -z "$FOUND" ]; then
            MATCH="$(find arch/arm64/configs -type f -name '*_defconfig' | head -n1 || true)"
            if [ -n "$MATCH" ]; then
              FOUND="${MATCH#arch/arm64/configs/}"
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "Nenhum defconfig encontrado em arch/arm64/configs"
            exit 1
          fi

          echo "Usando defconfig: $FOUND"
          echo "value=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 ${{ steps.defconfig.outputs.value }}
          make -j"$(nproc)" O=out ARCH=arm64

      - name: Pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
